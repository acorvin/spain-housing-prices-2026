<!-- Paste into a Code Block on alexcorvin.io. The page reports its own height, so the frame resizes to fit. -->
<iframe
  id="spain-housing-prices"
  src="https://acorvin.github.io/spain-housing-prices-2026/"
  title="House prices rose in every region of Spain: annual change in INE's housing price index by autonomous community, second quarter of 2026"
  style="width:100%;height:1100px;border:0;display:block"
  loading="lazy"
></iframe>
<script>
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://acorvin.github.io') return;
    if (!e.data || e.data.type !== 'spain-housing-prices:height') return;
    document.getElementById('spain-housing-prices').style.height = e.data.height + 'px';
  });
</script>
